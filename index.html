<script>
'use strict';
/* A complete circle traces one true sinusoidal cycle: at each finger angle θ,
   wave y is the Y-projection of the point at radius r, sampled at equal ANGULAR
   increments (not wall-clock time). Reversing the finger erases the trace. */
const $=id=>document.getElementById(id);
const CX=180,CY=131,PX=20,PW=320,BY=364,RR=[29,51,77],WR=[24,44,64],TAU=Math.PI*2;
const LEVELS=[
 ['うえから スタート',2,90,1,90],['したから スタート',2,270,1,0],['まんなかから',2,0,1,270],['ひだりから',2,180,1,0],
 ['おおきな やま',3,90,1,90],['ちいさな やま',1,90,1,90],['おおきな たに',3,270,1,0],['ちいさな たに',1,270,1,90],
 ['ちいさな まんなか',1,0,1,90],['おおきな まんなか',3,180,1,270],['ななめの やま',2,45,1,90],['ななめの たに',2,225,1,0],
 ['ちいさく ななめ',1,135,1,0],['おおきく ななめ',3,315,1,270],
 ['やまが ふたつ',2,90,2,90],['したから ふたつ',2,270,2,90],['ふたつの おおなみ',3,90,2,0],['ふたつの こなみ',1,270,2,90],
 ['ふたつの ななめ',2,45,2,0],['うらの ななめ',2,135,2,90],['ちいさな ふたつ',1,315,2,0],['おおきな ふたつ',3,225,2,90],
 ['なみが みっつ',2,0,3,90],['うえから みっつ',2,90,3,0],['したから みっつ',2,270,3,90],['おおきな みっつ',3,180,3,0],
 ['ちいさな みっつ',1,90,3,90],['ななめから みっつ',3,45,3,180],['ひみつの なみ',1,225,3,90],['なみの マスター',3,315,3,0]
];
const MAX=LEVELS.length, circleLen=2*Math.PI*95;
let index=0, unlocked=0, drawing=false, finished=false, succeeded=false, angle=90, radius=2, travels=0, lastFinger=0, dir=0, pointerID=null, audioOn=true, ac=null, soundStep=-1, resultTimeout=null, lastScore=null;
const els={svg:$('stage'),circle:$('bead'),pulse:$('beadPulse'),spoke:$('spoke'),guide:$('beadGuide'),guideEnd:$('guideEnd'),target:$('target'),targetGlow:$('targetGlow'),wave:$('drawnLine'),waveGlow:$('drawGlow'),pen:$('pen'),penHalo:$('penHalo'),scan:$('scanLine'),arc:$('progressArc'),num:$('centerNum'),unit:$('centerUnit'),status:$('status'),statusText:$('statusText'),board:$('board')};
try{unlocked=Math.max(0,Math.min(MAX-1,Number(localStorage.getItem('wl3-unlocked'))||0));index=Math.max(0,Math.min(unlocked,Number(localStorage.getItem('wl3-index'))||0));audioOn=localStorage.getItem('wl3-sound')!=='off'}catch(e){}
function level(){let [name,a,p,n,initial]=LEVELS[index];return{name,a,p,n,initial,allowRadius:index>=4,allowDiagonals:index>=10,step:index>=10?45:90}}
const rad=d=>d*Math.PI/180;
const wrap=d=>((d%360)+360)%360;
const diff=d=>((d+540)%360)-180;
function xy(deg,r){return{x:CX+r*Math.cos(rad(deg)),y:CY-r*Math.sin(rad(deg))}}
function waveY(deg,a){return BY-WR[a-1]*Math.sin(rad(deg))}
function buildWave(a,p,n,direction= -1,t=1){
 let count=Math.max(1,Math.ceil(500*Math.max(t,0)));let path='';
 for(let k=0;k<=count;k++){let frac=t*k/count;let x=PX+PW*frac,y=waveY(p+direction*360*n*frac,a);path+=(k?'L':'M')+x.toFixed(2)+' '+y.toFixed(2)+' '}
 return path;
}
function sound(f,gain=.03,secs=.09,delay=0){if(!audioOn)return;try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const now=ac.currentTime+delay,o=ac.createOscillator(),v=ac.createGain();o.type='sine';o.frequency.setValueAtTime(f,now);v.gain.setValueAtTime(.0001,now);v.gain.exponentialRampToValueAtTime(gain,now+.009);v.gain.exponentialRampToValueAtTime(.0001,now+secs);o.connect(v).connect(ac.destination);o.start(now);o.stop(now+secs+.015)}catch(e){}}
function clickSound(){sound(650,.026,.085);sound(925,.009,.095,.023)}
function ringSound(step){let melody=[523,587,659,784,659,587,523,784];sound(melody[Math.abs(step)%melody.length],.027,.11)}
function winSound(){[523,659,784,1047].forEach((note,i)=>sound(note,.074,.32,i*.105));sound(1568,.045,.30,.42)}
function status(t,kind=''){els.statusText.textContent=t;els.status.className='board-foot'+(kind?' '+kind:'')}
function selectRing(){const r=$('radiusRings').children;[...r].forEach((e,j)=>{e.setAttribute('stroke',j===radius-1?'#73d3c7':'#d7e9e5');e.setAttribute('stroke-width',j===radius-1?'2.8':'1.7');e.setAttribute('stroke-dasharray',j===radius-1?'2 4':'2 6')});}
function putBead(theta){const pt=xy(theta,RR[radius-1]);for(const e of [els.circle,els.pulse]){e.setAttribute('cx',pt.x);e.setAttribute('cy',pt.y)}els.spoke.setAttribute('x2',pt.x);els.spoke.setAttribute('y2',pt.y);els.guide.setAttribute('d',`M${pt.x} ${pt.y}H291`);els.guideEnd.setAttribute('cy',pt.y)}
function putPen(t,theta){const x=PX+PW*t,y=waveY(theta,radius);for(const e of [els.pen,els.penHalo]){e.setAttribute('cx',x);e.setAttribute('cy',y)}els.scan.setAttribute('x1',x);els.scan.setAttribute('x2',x);els.scan.setAttribute('opacity',t>.00001?'.62':'0')}
function progress(){const l=level(),t=Math.min(1,Math.abs(travels)/(l.n*360));els.arc.setAttribute('stroke-dasharray',`${(circleLen*t).toFixed(1)} ${circleLen.toFixed(1)}`);let current=Math.min(l.n,Math.floor(Math.abs(travels)/360+.001));els.num.textContent=finished?(succeeded?'✓':l.n):`${Math.max(0,l.n-current)}`;els.unit.textContent=finished?(succeeded?'できた！':'もういっかい'):'しゅう のこり';return t}
function renderTrace(){const l=level(),t=progress(),theta=angle+(dir||-1)*Math.abs(travels);putBead(theta);putPen(t,theta);let d=travels?buildWave(radius,angle,l.n,dir||-1,t):'';els.wave.setAttribute('d',d);els.waveGlow.setAttribute('d',d);selectRing();}
function resetTrace(keepStatus=false){if(resultTimeout){clearTimeout(resultTimeout);resultTimeout=null}drawing=false;finished=false;succeeded=false;dir=0;travels=0;pointerID=null;soundStep=-1;els.board.classList.remove('won','is-drawing');$('toast').classList.remove('show');$('guideHand').style.display=index===0?'':'none';$('reset').hidden=false;$('next').hidden=true;$('hint').disabled=false;radius=2;angle=level().initial;renderTrace();if(!keepStatus)status(index===0?'オレンジの 点から、ぐるっと なぞろう。':'おてほんと おなじ なみを つくろう。')}
function showLevel(n){if(n<0||n>=MAX||n>unlocked)return;index=n;const l=level();resetTrace(true);const s=String(n+1).padStart(2,'0');$('levelLabel').textContent=`LEVEL ${s}`;$('count').textContent=`${s} / ${MAX}`;$('progress').style.width=`${100*(n+1)/MAX}%`;$('title').textContent=l.name;
 $('subtitle').textContent=n<4?'なみの はじまりは、どこに あるかな？':n<10?'まるの 大きさで、なみの 高さが かわるよ。':n<14?'ななめの 場所からも ためしてみよう。':n<22?'2しゅう まわすと、なみも 2つ！':'3しゅう まわすと、なみは どうなる？';
 $('badge').textContent=`${l.n}しゅう なぞろう`;$('turnsLabel').textContent=`${l.n}しゅう = ${l.n}つの なみ`;
 const d=buildWave(l.a,l.p,l.n,-1,1);els.target.setAttribute('d',d);els.targetGlow.setAttribute('d',d);$('resultPulse').setAttribute('d',d);
 $('radiusRings').style.opacity=l.allowRadius?'1':'.53';$('previous').disabled=n===0;$('forward').disabled=n>=unlocked;
 $('underCaption').textContent=l.allowRadius?'スタートの ばしょと まるの 大きさが ヒント':'まるの 点の たかさが、なみになる';status(n===0?'オレンジの 点から、ぐるっと なぞろう。':`円の 好きな場所から ${l.n}しゅう なぞろう。`);try{localStorage.setItem('wl3-index',String(n))}catch(e){}
}
function svgPoint(evt){let p=els.svg.createSVGPoint();p.x=evt.clientX;p.y=evt.clientY;let matrix=els.svg.getScreenCTM();return matrix?p.matrixTransform(matrix.inverse()):{x:0,y:0}}
function polar(pt){const dx=pt.x-CX,dy=CY-pt.y;return {r:Math.hypot(dx,dy),a:wrap(Math.atan2(dy,dx)*180/Math.PI)}}
function pickup(evt){if(succeeded)return;const p=polar(svgPoint(evt));if(p.r<19||p.r>107)return;
 if(finished)resetTrace(true);
 const currentAngle=wrap(angle+(dir||-1)*travels);
 const resume=travels>3&&!finished&&dir!==0&&Math.abs(diff(p.a-currentAngle))<34&&Math.abs(p.r-RR[radius-1])<22;
 drawing=true;pointerID=evt.pointerId;els.board.classList.add('is-drawing');$('guideHand').style.display='none';
 const l=level();if(!resume){angle=wrap(Math.round(p.a/l.step)*l.step);if(l.allowRadius){let best=Infinity;RR.forEach((v,j)=>{let d=Math.abs(v-p.r);if(d<best){best=d;radius=j+1}})}else radius=2;travels=0;dir=0;soundStep=-1;}
 lastFinger=p.a;renderTrace();
 status(resume?'そのまま つづきから まわそう。':'指を はなさず、そのまま ぐるっと まわそう。');try{els.svg.setPointerCapture(evt.pointerId)}catch(e){}evt.preventDefault();if(!resume)clickSound();
}
function track(evt){if(!drawing||pointerID!==evt.pointerId)return;const p=polar(svgPoint(evt));
 const step=diff(p.a-lastFinger);lastFinger=p.a;
 if(Math.abs(step)>85)return; // skip impossible single-frame pointer teleports
 if(dir===0&&Math.abs(step)>1.3)dir=step>0?1:-1;
 if(dir){const l=level();let next=travels+step*dir;travels=Math.max(0,Math.min(l.n*360,next));}
 let beat=Math.floor(travels/90);if(beat>soundStep&&beat>0){soundStep=beat;ringSound(beat)}
 renderTrace();evt.preventDefault();
}
function evaluate(){const l=level();let e=0;for(let i=0;i<=240;i++){let x=i/240,y1=waveY(angle+dir*360*l.n*x,radius),y2=waveY(l.p-360*l.n*x,l.a);e=Math.max(e,Math.abs(y1-y2))}return e<7.0}
function release(evt){if(!drawing||pointerID!==evt.pointerId)return;try{els.svg.releasePointerCapture(evt.pointerId)}catch(e){}drawing=false;pointerID=null;els.board.classList.remove('is-drawing');const l=level();const t=Math.abs(travels)/(l.n*360);
 if(t>=.978){travels=l.n*360;renderTrace();finished=true;succeeded=evaluate();if(succeeded){win()}else{failure()}}
 else if(t<.04){status('スタートする ばしょを えらんでね。 ゆびで なぞってみよう。')}
 else{status(`あと すこし！ ${l.n}しゅう さいごまで つなげよう。`)}
}
function failDetail(){const l=level();if(radius!==l.a)return 'おてほんと なみの 高さが ちがうかな？';return 'どこから まわしはじめたか、くらべてみよう。'}
function failure(){progress();status(`${failDetail()} もういちど やってみよう。`,'error');clickSound();}
function particles(){let e=$('particles');e.innerHTML='';let colors=['#1cbdb3','#ffb991','#9f92df','#6ed6bf'];for(let i=0;i<24;i++){let dot=document.createElement('i'),a=(i/24)*TAU,d=75+(i*37)%94;dot.style.setProperty('--tx',`${Math.cos(a)*d}px`);dot.style.setProperty('--ty',`${Math.sin(a)*d}px`);dot.style.setProperty('--angle',`${i*49}deg`);dot.style.setProperty('--delay',`${(i%4)*.023}s`);dot.style.setProperty('--c',colors[i%4]);e.appendChild(dot)}}
function win(){succeeded=true;finished=true;progress();els.board.classList.remove('won');void els.board.offsetHeight;els.board.classList.add('won');$('hint').disabled=true;$('reset').hidden=true;$('next').hidden=false;
 $('next').innerHTML=index===MAX-1?'もういちど あそぶ <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V3h5M4 7a8 8 0 1 1 .4 9"/></svg>':'つぎの なみへ <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>';
 unlocked=Math.max(unlocked,Math.min(MAX-1,index+1));$('forward').disabled=index>=unlocked;try{localStorage.setItem('wl3-unlocked',String(unlocked))}catch(e){}
 status(index===MAX-1?'30の なみを ぜんぶ つくった！ すごい！':'ぴったり！ まるの うごきが なみになった！','success');particles();winSound();if(navigator.vibrate)try{navigator.vibrate(18)}catch(e){}
 $('toast').classList.add('show');resultTimeout=setTimeout(()=>{$('toast').classList.remove('show')},850);
}
function hint(){let l=level(),t;if(index<4)t='おてほんの 左はしは、上・下・まんなかの どこ？';else if(index<10)t='なみが 高いほど、円の 外がわから スタートしよう。';else if(index<14)t='ななめから 回すと、なみも ななめから はじまるよ。';else if(index<22)t='まるを 2しゅうさせると、なみの 山も 2つ！';else t='3しゅう まわそう。はじめる ばしょと 高さも よくみてね。';status(t);clickSound()}
function nextLevel(){if(index===MAX-1){unlocked=MAX-1;showLevel(0)}else showLevel(index+1);clickSound()}
$('touch').addEventListener('pointerdown',pickup);els.svg.addEventListener('pointermove',track);els.svg.addEventListener('pointerup',release);els.svg.addEventListener('pointercancel',release);
$('reset').addEventListener('click',()=>{resetTrace();clickSound()});$('hint').addEventListener('click',hint);$('next').addEventListener('click',nextLevel);
$('previous').addEventListener('click',()=>{showLevel(index-1);clickSound()});$('forward').addEventListener('click',()=>{showLevel(index+1);clickSound()});
$('help').addEventListener('click',()=>{$('helpOverlay').hidden=false});$('closeHelp').addEventListener('click',()=>{$('helpOverlay').hidden=true});$('helpOverlay').addEventListener('click',evt=>{if(evt.target===$('helpOverlay'))$('helpOverlay').hidden=true});
$('sound').addEventListener('click',()=>{audioOn=!audioOn;$('sound').style.opacity=audioOn?'1':'.55';$('sound').setAttribute('aria-label',audioOn?'音をオフにする':'音をオンにする');try{localStorage.setItem('wl3-sound',audioOn?'on':'off')}catch(e){}if(audioOn)clickSound()});
// Desktop accessible fallback: arrow keys aim; Space draws a full orbit in 1.3–3s.
let auto=null;window.addEventListener('keydown',evt=>{
 if(!$('helpOverlay').hidden){if(evt.key==='Escape')$('helpOverlay').hidden=true;return}if(['BUTTON'].includes(document.activeElement.tagName))return;
 const l=level();if(evt.key==='ArrowLeft'||evt.key==='ArrowRight'){evt.preventDefault();let prevAngle=angle,prevRadius=radius;resetTrace(true);radius=prevRadius;angle=wrap(prevAngle+(evt.key==='ArrowRight'?-l.step:l.step));renderTrace();clickSound();status('はじまりの ばしょを えらぼう。 スペースキーで まわそう。')}
 if(l.allowRadius&&(evt.key==='ArrowUp'||evt.key==='ArrowDown')){evt.preventDefault();let prevAngle=angle,prevRadius=radius;resetTrace(true);angle=prevAngle;radius=Math.min(3,Math.max(1,prevRadius+(evt.key==='ArrowUp'?1:-1)));renderTrace();clickSound()}
 if(evt.code==='Space'&&!drawing&&!succeeded){evt.preventDefault();let savedAngle=angle,savedRadius=radius;resetTrace(true);angle=savedAngle;radius=savedRadius;dir=-1;finished=false;let start=performance.now(),duration=l.n*870;const tick=now=>{let t=Math.min(1,(now-start)/duration);travels=t*l.n*360;renderTrace();if(t<1)auto=requestAnimationFrame(tick);else{finished=true;succeeded=evaluate();succeeded?win():failure()}};auto=requestAnimationFrame(tick)}
});
$('sound').style.opacity=audioOn?'1':'.55';showLevel(index);
</script>
</body>
</html>
